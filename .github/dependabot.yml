# Dependabot opens weekly PRs to update Go modules and GitHub Actions versions.
# Each PR runs the CI workflow, so a breaking update shows up as a red check.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
