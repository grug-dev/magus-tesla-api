version: "2"
# One sql entry per module. Each generates a module-scoped package that no other
# module imports — this is how "no cross-module DB access" is enforced at the
# package level (ai/architecture.md §2). Add a new entry when a module needs a DB.
sql:
  - engine: "postgresql"
    # The goose migrations dir is the single schema source; sqlc parses the goose
    # "-- +goose Up" sections and ignores the Down sections.
    schema: "internal/account/db/migrations"
    queries: "internal/account/db/query.sql"
    gen:
      go:
        package: "accountdb"
        out: "internal/account/db"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
        rename:
          account_account:     "Account"
          account_tesla_token: "TeslaToken"
          account_vehicle:     "Vehicle"
        overrides:
          # UUID columns → github.com/google/uuid.UUID (clean interface signatures),
          # instead of the default pgtype.UUID.
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # NOTE: timestamptz stays as the pgx/v5 default (pgtype.Timestamptz). The
          # account service converts to/from plain time.Time at its DB→domain mapping
          # boundary (see internal/account/service.go: `timestamp`), so the public
          # domain types expose time.Time without a pgtype dependency leaking out.

  # telemetry module — vehicle_snapshots + poll_attempts. Its own package
  # (telemetrydb), imported by no other module (ai/architecture.md §2). Same gen
  # options + uuid override as account; timestamptz likewise stays pgtype.Timestamptz
  # and is mapped to time.Time at internal/telemetry/service.go's DB→domain boundary.
  # Nullable sentry_mode BOOLEAN → pgtype.Bool; raw_data JSONB → []byte.
  - engine: "postgresql"
    schema: "internal/telemetry/db/migrations"
    queries: "internal/telemetry/db/query.sql"
    gen:
      go:
        package: "telemetrydb"
        out: "internal/telemetry/db"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  # charging module — manual_charge_entries (user-asserted home/work/3rd-party
  # charge sessions, no Tesla Fleet API). Its own package (chargingdb), imported
  # by no other module (ai/architecture.md §2, design D7/D8). Same uuid override +
  # emit flags as account/telemetry; timestamptz likewise stays pgtype.Timestamptz and
  # NUMERIC(6,2)/(14,2) stay pgtype.Numeric — the service maps both to time.Time /
  # float64 at internal/charging/service.go's DB→domain boundary (design D9).
  - engine: "postgresql"
    schema: "internal/charging/db/migrations"
    queries: "internal/charging/db/query.sql"
    gen:
      go:
        package: "chargingdb"
        out: "internal/charging/db"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
        rename:
          charging_manual_charge_entry:  "ManualChargeEntry"
          charging_supercharger_session: "SuperchargerSession"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  # analytics module — vehicle_metrics + vehicle_metric_watermarks (the precomputed
  # daily read model and its per-source recompute cursors). Its own package
  # (analyticsdb), imported by no other module (ai/architecture.md §2). This is the
  # first time analytics owns persistence at all — until RM29 tier 3 it was a pure
  # derivation module reading other modules' data through their ports. Same uuid
  # override + emit flags as the three entries above; timestamptz likewise stays
  # pgtype.Timestamptz and the nullable _calc columns stay pgtype.* — the service maps
  # both at internal/analytics's DB→domain boundary (design D9/D13).
  - engine: "postgresql"
    schema: "internal/analytics/db/migrations"
    queries: "internal/analytics/db/query.sql"
    gen:
      go:
        package: "analyticsdb"
        out: "internal/analytics/db"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
        rename:
          analytics_charge_gap:               "ChargeGap"
          analytics_vehicle_metric:            "VehicleMetric"
          analytics_vehicle_metric_watermark:  "VehicleMetricWatermark"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
