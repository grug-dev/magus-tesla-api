# OpenSpec project configuration — tailors AI behavior to this project.
schema: spec-driven

context: |
  Project: magus-tesla-api — a multi-tenant Tesla analytics platform, the
  "Agentic Modular Monolith". AGENTS.md, CLAUDE.md, and ai/*.md are the
  authoritative architecture and conventions; specs here describe capability
  behavior, not architecture.

  Tech stack: Go, htmx + Templ (the UI gateway), PostgreSQL via pgx, sqlc for
  type-safe DB access.

  Architecture (see ai/architecture.md): modular monolith under internal/; each
  module owns its own data and exposes a Go interface (its "port"); no HTML
  outside internal/gateway/; no cross-module database access; adapters such as
  internal/tesla use ...Tesla-suffixed DTOs (ai/architecture.md §6). Each OpenSpec
  domain maps to one internal/ module.

rules:
  specs:
    - Use GIVEN/WHEN/THEN format for scenarios.
    - Describe capability behavior (WHAT); implementation (HOW) lives in design.md and ai/*.md.
  design:
    - Keep each module's persistence schema module-scoped (internal/<module>/db) to preserve boundaries.
  proposal:
    - State whether the change is breaking and which modules it affects.
    - Must use grill-me skill
    - Change names must start with the owning module name — <module>-<verb-noun-slug> (e.g. tesla-add-charge-state); use platform- for cross-cutting changes.
    - If the change spans multiple modules, do NOT create one big change — create openspec/roadmaps/<feature-name>.md (+ sibling .progress.json) with one module-prefixed change per tier, then proceed one module change at a time (see ai/agentic-workflow.md §pipeline).
  tasks:
    - Use the task list format (with checkboxes) for tasks.
    - Each task must be atomic and testable.
    - Keep tasks.md updated live as I apply (so openspec status always shows real progress and any session can resume)
    - Group tasks into isolated, independent sub-tasks with explicit dependencies so separate agents can implement them — in parallel when they touch disjoint files.
    - When applying, also maintain openspec/changes/<change>/progress.json (contract in ai/agentic-workflow.md) — update the matching task entry live alongside tasks.md.
  archive:
    - Group archived changes by business domain under openspec/changes/archive/<domain>/ (do NOT dump them flat in openspec/changes/archive/).
    - Target path: openspec/changes/archive/<domain>/YYYY-MM-DD-<change-name>.
    - Determine <domain> from the change's primary affected module before archiving. If a change spans modules, choose the one whose capability it most advances; for cross-cutting changes use "platform".
    - Create the <domain> subfolder if it does not exist.
    - Canonical domains for this project (mirror internal/ modules): account, gateway, tesla, googleauth, config, platform (for cross-cutting/setup tasks not owned by one module).
    - Never archive a change whose progress.json exists but review.status is not reviewer-approved — the reviewer role sets that, nobody else (see ai/agentic-workflow.md §pipeline).
