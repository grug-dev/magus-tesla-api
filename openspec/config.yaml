# OpenSpec project configuration — tailors AI behavior to this project.
schema: spec-driven

context: |
  Project: magus-tesla-api — a multi-tenant Tesla analytics platform, the
  "Agentic Modular Monolith". AGENTS.md, CLAUDE.md, and ai/*.md are the
  authoritative architecture and conventions; specs here describe capability
  behavior, not architecture.

  Tech stack: Go, htmx + Templ (the UI gateway), PostgreSQL via pgx, sqlc for
  type-safe DB access.

  Architecture (see ai/architecture.md): modular monolith under internal/; each
  module owns its own data and exposes a Go interface (its "port"); no HTML
  outside internal/gateway/; no cross-module database access; adapters such as
  internal/tesla use ...Tesla-suffixed DTOs (ai/architecture.md §6). Each OpenSpec
  domain maps to one internal/ module.

  Branch, ticket & work-counter conventions (mirror of the kkpa-dev-harness-pipeline
  skill, Step 1a — that skill is the source of truth; keep the two in sync):

  - ONE shared counter: openspec/.work-counter, a plain-text file holding the NEXT
    integer, used by BOTH standalone-change (CH<N>) and roadmap (RM<N>) branches, so a
    number identifies exactly one piece of work. Read it, write N+1 back immediately,
    and commit the bump with the artifacts. It is monotonic — never reused, never
    decremented, untouched by archiving.
  - openspec/.ch-counter and openspec/roadmaps/.rm-counter are RETIRED. Never read or
    bump them. If one is still present alongside .work-counter it is a leftover to be
    deleted — .work-counter always wins.
  - Branch name: ft/CH<N>[-<TICKET>]-<change-name> for a standalone change (e.g.
    ft/CH10-MAG-5-gateway-improve-manual-charge-form), or ONE shared
    ft/RM<N>[-<TICKET>]-<feature-name> for a whole roadmap.
  - CH<N> and the Linear ticket are BRANCH-ONLY: neither ever enters the change name,
    the artifacts, or the archived folder. (RM<N> is the exception — it does prefix
    roadmap-owned change names: RM<N>-<module>-<verb-noun-slug>.)
  - The ticket is recorded in progress.json as git.ticket / git.ticket_url (both null
    when there is none) — there is no source_ticket field — and on every commit as the
    scope suffix plus a trailer: "docs(openspec/MAG-5): …" + "Ticket: MAG-5". The
    proposal header additionally carries "Source: <TICKET> — <url>".

rules:
  specs:
    - Use GIVEN/WHEN/THEN format for scenarios.
    - Describe capability behavior (WHAT); implementation (HOW) lives in design.md and ai/*.md.
  design:
    - Keep each module's persistence schema module-scoped (internal/<module>/db) to preserve boundaries.
    - Any new/changed database object (table, column, index, constraint, view, migration) MUST include the full schema, the rationale (why this design is right — trade-offs and rejected alternatives), and an index plan justified against the project's read patterns. design.md is REQUIRED for any DB-touching change — never skipped as "simple".
    - Designs optimize for READ performance by default - reads are mandatory-fast; writes run mostly via midnight pollers and may pay the cost (denormalize, index aggressively, precompute) — never at the cost of module boundaries or data ownership.
  proposal:
    - State whether the change is breaking and which modules it affects.
    - Must use grill-me skill
    - Performance-sensitive proposals (anything touching the database or a hot read path) must name the read path(s) they affect.
    - Change names must start with the owning module name — <module>-<verb-noun-slug> (e.g. tesla-add-charge-state); use platform- for cross-cutting changes. The CH<N> branch number and the Linear ticket ID never appear in a change name (they are branch-only — see the branch/ticket conventions in context above); only a roadmap's RM<N> prefixes change names.
    - Carry the Linear ticket in the proposal header as "Source: <TICKET> — <url>" whenever the change came from a ticket.
    - If the change spans multiple modules, do NOT create one big change — create openspec/roadmaps/<feature-name>.md (+ sibling .progress.json) with one module-prefixed change per tier, then proceed one module change at a time (see ai/agentic-workflow.md §pipeline).
  tasks:
    - Use the task list format (with checkboxes) for tasks.
    - Each task must be atomic and testable.
    - Keep tasks.md updated live as I apply (so openspec status always shows real progress and any session can resume)
    - Group tasks into isolated, independent sub-tasks with explicit dependencies so separate agents can implement them — in parallel when they touch disjoint files.
    - Keep openspec/changes/<change>/progress.json truthful. Its schema and write-ownership are the kkpa-dev-harness-pipeline skill's own contract (references/progress-schema.md) and are NOT project-overridable — do not restate them here or in ai/agentic-workflow.md, or the copy goes stale and teaches the wrong rules.
    - On progress.json write-ownership — the LEADER is its only writer, apart from the reviewer's own `review` block. Module workers NEVER write it — not their task entries, not notes, not budget. They report per-task status, timestamps and a short note in their final report, and the leader transcribes once per wave (every subagent write is re-injected into the leader's context, which costs more than everything it saves). Only tasks.md checkboxes are updated live, by whoever does the work.
  archive:
    - Group archived changes by business domain under openspec/changes/archive/<domain>/ (do NOT dump them flat in openspec/changes/archive/).
    - Target path: openspec/changes/archive/<domain>/YYYY-MM-DD-<change-name>.
    - Determine <domain> from the change's primary affected module before archiving. If a change spans modules, choose the one whose capability it most advances; for cross-cutting changes use "platform".
    - Create the <domain> subfolder if it does not exist.
    - Canonical domains for this project (mirror internal/ modules): account, analytics, app, charging, clock, config, gateway, googleauth, telemetry, tesla, platform (for cross-cutting/setup tasks not owned by one module). Historical folders battery/ and manualcharge/ are pre-rename names (RM29) — never target them for new archives.
    - Never archive a change whose progress.json exists but review.status is not reviewer-approved — the reviewer role sets that, nobody else (see ai/agentic-workflow.md §pipeline).
